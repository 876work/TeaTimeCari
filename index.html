<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tea Time Cari | Community Platform</title>
    <link rel="icon" type="image/png" href="/teaLogo.png" />
    <link rel="apple-touch-icon" href="/teaLogo.png" />
    <script id="disc-sso-bootstrap">
      (function () {
        try {
          var sp = new URLSearchParams(window.location.search);
          var n = sp.get('sso_nonce');
          var r = sp.get('r');
          if (n) sessionStorage.setItem('disc_nonce', n);
          if (r) sessionStorage.setItem('disc_return', r);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
    </form>
    <form name="login" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="login" />
      <input type="email" name="email" />
      <input type="password" name="password" />
    </form>
    <form name="forgot-password" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="forgot-password" />
      <input type="email" name="email" />
    </form>
    <form name="reset-password" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="reset-password" />
      <input type="password" name="password" />
      <input type="password" name="confirm" />
    </form>
    <form name="registration-step-1" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="registration-step-1" />
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="username" />
      <input type="password" name="password" />
      <input type="password" name="confirmPassword" />
    </form>
    <form name="discourse-admin-search" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="discourse-admin-search" />
      <input type="search" name="search" />
    </form>
    <form name="admin-login" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="admin-login" />
      <input type="email" name="email" />
      <input type="password" name="password" />
    </form>
    <form name="payment" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="payment" />
      <input type="hidden" name="amount" />
      <input type="hidden" name="currency" />
      <input type="hidden" name="feedAccess" />
    </form>
    <form name="profile-change-password" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="profile-change-password" />
      <input type="password" name="newPassword" />
      <input type="password" name="confirmPassword" />
      <input type="text" name="reauthCode" />
    </form>
    <form name="post-comment" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="post-comment" />
      <textarea name="comment"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch: {}

jobs:
  # Apply pending database migrations first. Functions frequently reference
  # tables created by migrations, so schema changes must land before the code
  # that depends on them is deployed. Authenticates via SUPABASE_ACCESS_TOKEN;
  # SUPABASE_DB_PASSWORD is optional (used as a fallback if token-based
  # database auth is unavailable).
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply database migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          # The remote migration history contains version 20250817123343,
          # which was applied directly on the hosted database and never
          # committed to this repo. db push refuses to run until that stray
          # entry is removed from the history table (schema is untouched).
          # Safe to delete this step after one successful run.
          supabase migration repair --status reverted 20250817123343 || true
          supabase migration list
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  deploy-functions:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
